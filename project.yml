name: AthkarApp
options:
  bundleIdPrefix: com.eyad
targets:
  AthkarApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        includes:
          - "*.swift"
    resources:
      - path: Web
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.eyad.AthkarApp
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: NO
