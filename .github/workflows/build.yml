name: Build iOS IPA for Device

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS IPA for Real Device
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build and Archive App for Real Device
        run: |
          xcodebuild -project AthkarApp.xcodeproj \
                     -scheme AthkarApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath .build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ALLOWED=NO \
                     archive -archivePath .build/AthkarApp.xcarchive

      - name: Export IPA
        run: |
          # إنشاء مجلد البيلد وتصدير ملف الـ .app لفكره وتحويله لـ IPA
          mkdir -p .build/Payload
          cp -r .build/AthkarApp.xcarchive/Products/Applications/*.app .build/Payload/
          cd .build && zip -r AthkarApp.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AthkarApp-IPA
          path: .build/AthkarApp.ipa
